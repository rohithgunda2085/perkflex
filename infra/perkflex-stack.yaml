AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PerkFlex: FastAPI on ECS Fargate behind an Application Load Balancer, the React site on S3 behind CloudFront
  (with /api/* routed to the API on the same address), secrets in Secrets Manager, and Bedrock access through an
  IAM task role. The existing RDS PostgreSQL database is reused, not created.

# ---------------------------------------------------------------------------------------------------------------
# HOW TO DEPLOY FROM AWS CLOUDSHELL (region us-east-1, the same region as your RDS instance)
#
# 0. Before you start
#    - Bedrock console > Model access: make sure Claude Haiku 4.5 is enabled in this account and region.
#    - Rotate the RDS password (it was shared in chat) and keep the new one for step 3.
#    - The stack must run in the VPC that holds your RDS instance. Find it:
#        aws rds describe-db-instances --db-instance-identifier <name> \
#          --query 'DBInstances[0].[DBSubnetGroup.VpcId,VpcSecurityGroups[0].VpcSecurityGroupId,Endpoint.Address]' --output text
#    - Pick two PUBLIC subnets in different Availability Zones of that VPC:
#        aws ec2 describe-subnets --filters Name=vpc-id,Values=<vpc-id> \
#          --query 'Subnets[].[SubnetId,AvailabilityZone,MapPublicIpOnLaunch]' --output table
#
# 1. Upload this file to CloudShell (Actions > Upload file), then read the DB password without echoing it:
#        read -rs DB_PASSWORD
#
# 2. Create the stack with no running tasks yet (there is no image in ECR until step 4):
#        aws cloudformation deploy --stack-name perkflex --template-file perkflex-stack.yaml \
#          --capabilities CAPABILITY_IAM --parameter-overrides \
#          VpcId=<vpc-id> SubnetIds=<subnet-a>,<subnet-b> RdsSecurityGroupId=<rds-sg-id> \
#          DbHost=<rds-endpoint> DbPassword="$DB_PASSWORD" DesiredCount=0
#
# 3. Read the stack outputs:
#        aws cloudformation describe-stacks --stack-name perkflex --query 'Stacks[0].Outputs' --output table
#
# 4. Build and push the API image. On your computer zip the backend folder without the virtualenv, caches or the
#    demo credentials file:
#        cd perkflex && zip -r backend.zip backend -x 'backend/tests/*' 'backend/db/demo-credentials.local.md' '*/__pycache__/*'
#    Upload backend.zip to CloudShell, then:
#        unzip -q backend.zip
#        REPO=<EcrRepositoryUri output>
#        aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
#        docker build --platform linux/amd64 -t "$REPO:latest" backend
#        docker push "$REPO:latest"
#    (If your CloudShell has no Docker, build the image on any machine with Docker and push it the same way.)
#
# 5. Start the service:
#        aws cloudformation deploy --stack-name perkflex --template-file perkflex-stack.yaml \
#          --capabilities CAPABILITY_IAM --parameter-overrides DesiredCount=1 \
#          VpcId=<vpc-id> SubnetIds=<subnet-a>,<subnet-b> RdsSecurityGroupId=<rds-sg-id> \
#          DbHost=<rds-endpoint> DbPassword="$DB_PASSWORD"
#    Always repeat every parameter you set in step 2 (or use UsePreviousValue in the console). Your DB schema is
#    already migrated. To run migrations later, use a one-off task:
#        aws ecs run-task --cluster <ClusterName output> --launch-type FARGATE --task-definition <TaskDefinitionArn output> \
#          --network-configuration 'awsvpcConfiguration={subnets=[<subnet-a>],securityGroups=[<TaskSecurityGroupId output>],assignPublicIp=ENABLED}' \
#          --overrides '{"containerOverrides":[{"name":"api","command":["python","-m","app.cli","migrate"]}]}'
#
# 5b. Shipping a new API image later: the task definition always points at the same tag, so pushing alone changes
#    nothing. After every push run:
#        aws ecs update-service --cluster <ClusterName output> --service <ServiceName output> --force-new-deployment
#    (or push a new tag and deploy with ImageTag=<tag>).
#
# 6. Publish the website. On your computer: npm ci && npm run build, then zip frontend/dist (zip -r dist.zip frontend/dist).
#    Upload dist.zip to CloudShell, then:
#        unzip -q dist.zip
#        aws s3 sync frontend/dist "s3://<SiteBucketName output>" --delete
#        aws cloudfront create-invalidation --distribution-id <DistributionId output> --paths '/*'
#
# 7. Check it: open the SiteUrl output, or  curl -s <SiteUrl>/api/health  (expect {"ok":true}).
#
# TO DELETE EVERYTHING: empty the site bucket first (aws s3 rm "s3://<bucket>" --recursive), then
#    aws cloudformation delete-stack --stack-name perkflex   (your RDS database is not part of this stack).
#
# BEFORE THE FIRST START: the API image must contain the Amazon RDS CA bundle (global-bundle.pem) when DbSsl=verify.
#    If you are not sure it does, deploy with DbSsl=require (encrypted, certificate not verified) and switch to verify
#    once the bundle is in the image. With a missing bundle and DbSsl=verify the tasks cannot connect and keep restarting.
#
# SECURITY NOTES
#  - Without DomainName, CloudFront talks to the load balancer over plain HTTP. Passwords and the session cookie
#    then cross the internet unencrypted between CloudFront and the load balancer. The load balancer only forwards
#    requests that carry a secret header that CloudFront adds, which stops direct access, but it does not encrypt
#    that hop. That is acceptable for a short demo with synthetic data. For anything longer, set DomainName and
#    HostedZoneId: the stack then issues a certificate and uses HTTPS end to end.
#  - To also limit the load balancer to CloudFront addresses, pass CloudFrontPrefixListId:
#        aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
#          --query 'PrefixLists[0].PrefixListId' --output text
#    The CloudFront prefix list counts as about 55 rules against the security group quota (default 60), so you may
#    need a quota increase. Without it, the secret header already blocks direct access.
#  - The CloudFront-to-load-balancer secret header value is stored in the CloudFront and listener configuration, so
#    anyone who can view those resources can read it. The person running the deploy also needs
#    secretsmanager:GetSecretValue, because CloudFormation resolves the header secret during the deploy.
#  - The API's login and assistant rate limits are kept in memory, so with DesiredCount above 1 each task counts
#    separately and the real limit is multiplied.
#  - Single page app routes (for example /checkin/B01) are handled by a CloudFront Function on the site behaviour,
#    not by error pages, so API errors on /api/* are never rewritten into index.html.
#  - The stack adds one inbound rule (5432 from the API) to your existing RDS security group. It is removed when
#    the stack is deleted.
# ---------------------------------------------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network (must be the VPC that holds the RDS instance) }
        Parameters: [VpcId, SubnetIds, TaskAssignPublicIp, RdsSecurityGroupId, CloudFrontPrefixListId]
      - Label: { default: Database }
        Parameters: [DbHost, DbPort, DbName, DbUser, DbPassword, DbSsl]
      - Label: { default: Application }
        Parameters: [ImageTag, DesiredCount, BedrockModelId, DemoMode, DemoNow]
      - Label: { default: Advisor safety and hosting (optional) }
        Parameters: [EnableGuardrail, AdvisorRuntime, AgentCoreRuntimeArn]
      - Label: { default: Email notifications (optional) }
        Parameters: [EmailFromAddress]
      - Label: { default: Custom domain (optional) }
        Parameters: [DomainName, HostedZoneId]

Parameters:
  EnableGuardrail:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create an Amazon Bedrock Guardrail and apply it to the advisor and the assistant, as a second layer beside the
      application's own validator (which stays the real safety net).
  AdvisorRuntime:
    Type: String
    Default: local
    AllowedValues: [local, agentcore]
    Description: >-
      local runs the advisor's model loop inside the API. agentcore sends it to an Amazon Bedrock AgentCore Runtime
      (see docs/AGENTCORE.md). The API validates the answer either way.
  AgentCoreRuntimeArn:
    Type: String
    Default: ""
    Description: ARN of the AgentCore runtime. Required when AdvisorRuntime is agentcore.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC that contains your RDS instance.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different Availability Zones. Used by the load balancer and the API tasks.
  TaskAssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: ENABLED
    Description: >-
      ENABLED gives tasks a public IP so they can pull the image and reach Bedrock without a NAT gateway (use with
      public subnets). Use DISABLED only if the subnets have a NAT gateway or VPC endpoints.
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The security group attached to your RDS instance. The stack adds an inbound rule for the API.
  CloudFrontPrefixListId:
    Type: String
    Default: ""
    Description: Optional. Managed prefix list com.amazonaws.global.cloudfront.origin-facing. Limits the load balancer to CloudFront.
  DbHost:
    Type: String
    MinLength: 3
    Description: RDS endpoint host name.
  DbPort:
    Type: Number
    Default: 5432
  DbName:
    Type: String
    Default: perkflexdb
  DbUser:
    Type: String
    Default: postgres
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Stored in Secrets Manager and injected into the container.
  DbSsl:
    Type: String
    AllowedValues: [verify, require, disable]
    Default: verify
    Description: >-
      verify checks the database certificate and needs the RDS CA bundle inside the API image. Use require until the
      bundle is in the image. Avoid disable.
  ImageTag:
    Type: String
    Default: latest
    Description: Tag of the image in the ECR repository this stack creates.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Keep 0 until you have pushed an image (step 4), then set 1 or more.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    AllowedPattern: ^[a-z]+\.anthropic\.[a-z0-9.:-]+$
    Description: Bedrock inference profile ID used by the fare assistant.
  DemoMode:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: "true lets a signed-in user switch to another demo traveller. Keep false for anything shared."
  DemoNow:
    Type: String
    Default: "2027-12-15T23:59:00+00:00"
    Description: >-
      Demo only. The seed flights are in 2026 and 2027, so check-in windows are judged against this fixed time. Every
      deployment runs on this date until you set the value to empty, which uses the real clock. Empty it for anything
      beyond a short demo.
  EmailFromAddress:
    Type: String
    Default: ""
    Description: >-
      Optional. An address to send traveller emails from, through Amazon SES (for example no-reply@example.com). Leave
      empty for no email. SES sends a verification email to this address: open its link once. A new SES account is in the
      sandbox, so it can only send to verified addresses until you ask AWS for production access (see docs/EMAIL.md).
  DomainName:
    Type: String
    Default: ""
    Description: Optional. Site address such as perkflex.example.com. Needs HostedZoneId and the us-east-1 region.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional. Route 53 hosted zone that contains DomainName. The zone must already be live (name servers delegated).

Rules:
  DomainAndZoneTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref DomainName, ""]
            - !Equals [!Ref HostedZoneId, ""]
          - !And
            - !Not [!Equals [!Ref DomainName, ""]]
            - !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: Set both DomainName and HostedZoneId, or leave both empty.
  AgentCoreNeedsArn:
    RuleCondition: !Equals [!Ref AdvisorRuntime, agentcore]
    Assertions:
      - Assert: !Not [!Equals [!Ref AgentCoreRuntimeArn, ""]]
        AssertDescription: Set AgentCoreRuntimeArn when AdvisorRuntime is agentcore.
  DomainNeedsUsEast1:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: A custom domain needs this stack in us-east-1 (CloudFront certificates must live there).

Conditions:
  UseGuardrail: !Equals [!Ref EnableGuardrail, "true"]
  UseAgentCore: !And
    - !Equals [!Ref AdvisorRuntime, agentcore]
    - !Not [!Equals [!Ref AgentCoreRuntimeArn, ""]]
  UseEmail: !Not [!Equals [!Ref EmailFromAddress, ""]]
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  HasPrefixList: !Not [!Equals [!Ref CloudFrontPrefixListId, ""]]

Resources:
  # ------------------------------------------------------------------------------------------ container registry
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the 10 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}-api
      RetentionInDays: 30

  # ------------------------------------------------------------------------------------------------- secrets
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: PerkFlex database password
      SecretString: !Ref DbPassword

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signs the PerkFlex login cookie
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared value that CloudFront sends to the load balancer, so only CloudFront traffic is forwarded
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # ------------------------------------------------------------------------------------------------ network
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PerkFlex load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !If [HasDomain, 443, 80]
          ToPort: !If [HasDomain, 443, 80]
          CidrIp: !If [HasPrefixList, !Ref "AWS::NoValue", 0.0.0.0/0]
          SourcePrefixListId: !If [HasPrefixList, !Ref CloudFrontPrefixListId, !Ref "AWS::NoValue"]
          Description: !If [HasPrefixList, From CloudFront only, From anywhere (requests need the CloudFront secret header)]

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PerkFlex API tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From the load balancer

  RdsIngressFromApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: PerkFlex API tasks

  # ----------------------------------------------------------------------------------------------------- IAM
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbPasswordSecret
                  - !Ref SessionSecret

  # ------------------------------------------------------------------------------------------ Bedrock Guardrail
  # A second layer on the model's input and output. It blocks prompt-injection attempts and removes personal data
  # from what the traveller types. It does not decide anything about points: the validator in the API does that.
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: UseGuardrail
    Properties:
      Name: !Sub "${AWS::StackName}-advisor"
      Description: Prompt-attack, content and personal-data filters for the PerkFlex advisor and assistant.
      BlockedInputMessaging: I can only help with your trip's bags, seats and perks.
      BlockedOutputsMessaging: I can only help with your trip's bags, seats and perks.
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
          - { Type: HATE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: INSULTS, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: VIOLENCE, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: MISCONDUCT, InputStrength: MEDIUM, OutputStrength: MEDIUM }
      TopicPolicyConfig:
        TopicsConfig:
          - Name: Financial and legal advice
            Type: DENY
            Definition: Recommendations about investments, taxes, loans or legal action.
            Examples:
              - Should I invest my points in crypto?
              - Can I sue the airline?
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: ADDRESS, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK }
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: BLOCK }
          - { Type: PASSWORD, Action: BLOCK }

  # A numbered version, so a console edit of the working draft cannot change what production enforces.
  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Condition: UseGuardrail
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: Deployed with the stack

  # What the running API may do: call the one Bedrock model, apply the guardrail, and (optionally) call the advisor runtime.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-bedrock-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
                  - !Join
                    - ""
                    - - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/
                      - !Select [1, !Split [".", !Ref BedrockModelId]]
                      - "."
                      - !Select [2, !Split [".", !Ref BedrockModelId]]
        - !If
          - UseGuardrail
          - PolicyName: apply-guardrail
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:ApplyGuardrail
                  Resource: !GetAtt Guardrail.GuardrailArn
          - !Ref AWS::NoValue
        - !If
          - UseAgentCore
          - PolicyName: invoke-advisor-runtime
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock-agentcore:InvokeAgentRuntime
                  Resource:
                    - !Ref AgentCoreRuntimeArn
                    - !Sub "${AgentCoreRuntimeArn}/*"
          - !Ref AWS::NoValue
        - !If
          - UseEmail
          - PolicyName: send-email
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: ses:SendEmail
                  Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailFromAddress}
          - !Ref AWS::NoValue

  # ---------------------------------------------------------------------------------------------- Email (SES)
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: UseEmail
    Properties:
      EmailIdentity: !Ref EmailFromAddress

  # ---------------------------------------------------------------------------------------------- ECS service
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${EcrRepository.RepositoryUri}:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - { Name: ENVIRONMENT, Value: production }
            - { Name: DEMO_MODE, Value: !Ref DemoMode }
            - { Name: DEMO_NOW, Value: !Ref DemoNow }
            - { Name: DB_HOST, Value: !Ref DbHost }
            - { Name: DB_PORT, Value: !Ref DbPort }
            - { Name: DB_NAME, Value: !Ref DbName }
            - { Name: DB_USER, Value: !Ref DbUser }
            - { Name: DB_SSL, Value: !Ref DbSsl }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: BEDROCK_MODEL_ID, Value: !Ref BedrockModelId }
            - { Name: BEDROCK_GUARDRAIL_ID, Value: !If [UseGuardrail, !GetAtt Guardrail.GuardrailId, ""] }
            - { Name: BEDROCK_GUARDRAIL_VERSION, Value: !If [UseGuardrail, !GetAtt GuardrailVersion.Version, DRAFT] }
            - { Name: ADVISOR_RUNTIME, Value: !If [UseAgentCore, agentcore, local] }
            - { Name: AGENTCORE_RUNTIME_ARN, Value: !If [UseAgentCore, !Ref AgentCoreRuntimeArn, ""] }
            - { Name: EMAIL_ENABLED, Value: !If [UseEmail, "true", "false"] }
            - { Name: EMAIL_FROM, Value: !Ref EmailFromAddress }
            - { Name: PUBLIC_BASE_URL, Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"] }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Ref DbPasswordSecret }
            - { Name: SESSION_SECRET, ValueFrom: !Ref SessionSecret }
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status==200 else 1)"
            Interval: 30
            Timeout: 8
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  # One listener: HTTP on port 80 without a domain, HTTPS on 443 with one. Anything without the secret header gets 403.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !If [HasDomain, 443, 80]
      Protocol: !If [HasDomain, HTTPS, HTTP]
      SslPolicy: !If [HasDomain, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref "AWS::NoValue"]
      Certificates: !If
        - HasDomain
        - - CertificateArn: !Ref Certificate
        - !Ref "AWS::NoValue"
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Forbidden

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub "{{resolve:secretsmanager:${OriginVerifySecret}:SecretString}}"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref TaskAssignPublicIp
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------------------------ website: S3 + CloudFront
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for single page app routes. Applied only to the site behaviour, never to /api/*.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extension-less paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === "/" || uri.indexOf(".") !== -1) { return request; }
          request.uri = "/index.html";
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: PerkFlex site and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !If [HasDomain, !Sub "origin.${DomainName}", !GetAtt LoadBalancer.DNSName]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: !If [HasDomain, https-only, http-only]
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginVerifySecret}:SecretString}}"
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed policies: CachingOptimized, and SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            Compress: false
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            # Managed policies: CachingDisabled, and AllViewerExceptHostHeader (forwards cookies and headers)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ---------------------------------------------------------------------- optional custom domain (HasDomain only)
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub origin.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub origin.${DomainName}
          HostedZoneId: !Ref HostedZoneId

  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed value for every CloudFront distribution

  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  OriginRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub origin.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

Outputs:
  SiteUrl:
    Description: Open this in a browser
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  EcrRepositoryUri:
    Description: Push the API image here
    Value: !GetAtt EcrRepository.RepositoryUri
  SiteBucketName:
    Description: Upload frontend/dist here
    Value: !Ref SiteBucket
  DistributionId:
    Description: Use for cache invalidations
    Value: !Ref Distribution
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  LogGroupName:
    Value: !Ref LogGroup
  GuardrailId:
    Condition: UseGuardrail
    Description: The Bedrock Guardrail applied to the advisor and the assistant
    Value: !GetAtt Guardrail.GuardrailId
  GuardrailVersionNumber:
    Condition: UseGuardrail
    Value: !GetAtt GuardrailVersion.Version
